services:
  xray-core:
    container_name: xray-core
    restart: always
    build:
      args:
        TARGET_SERVER: "topicgowild.mine.bz"
        TARGET_PORT: "443"
      context: .
      dockerfile: ./xray-core-Dockerfile
    ports:
      - 443:8443
      - "127.0.0.1:54321:54321"


    volumes:
    - type: volume
      source: xray-core-settings
      target: /usr/local/etc/xray

    - type: volume
      source: containers-logs
      target: /var/log/xray
      
  v2ray-exporter:
    container_name: v2ray-exporter
    restart: always
    image: wi1dcard/v2ray-exporter:master
    command:
      - --v2ray-endpoint=xray-core:54321   
      - --listen=:9550
    #network_mode: host
    ports:
      - "127.0.0.1:9550:9550"
    depends_on:
      - xray-core

volumes:
  xray-core-settings:
  containers-logs:
