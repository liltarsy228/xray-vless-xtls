services:
  xray-core:
    container_name: xray-core
    restart: on-failure
    build:
      args:
        TARGET_SERVER: "marx.guide"
        TARGET_PORT: "443"
      context: .
      dockerfile: ./xray-core-Dockerfile

    network_mode: host

    volumes:
    - type: volume
      source: xray-core-settings
      target: /usr/local/etc/xray

    - type: volume
      source: containers-logs
      target: /var/log/xray
      
  v2ray-exporter:
    container_name: v2ray-exporter
    restart: on-failure
    image: wi1dcard/v2ray-exporter:master
    command:
      - --v2ray-endpoint=127.0.0.1:54321   
      - --listen=:9550
    network_mode: host
    depends_on:
      - xray-core

volumes:
  xray-core-settings:
  containers-logs: